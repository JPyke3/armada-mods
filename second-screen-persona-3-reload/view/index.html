<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Sizes follow the panel: 1rem is about 37 device pixels on a 1240x1080 screen. */
  html { font-size: 3.4vh; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
  ::-webkit-scrollbar { display: none; } * { scrollbar-width: none; box-sizing: border-box; }
  body { --cy: #53e6ff; --bl: #1638e0; --dk: #050b3a; background: #06103f; color: #fff; font: 700 .8rem "Noto Sans", sans-serif; display: flex; flex-direction: column;
         background-image: linear-gradient(115deg, transparent 0 58%, rgba(83,230,255,.07) 58% 59%, transparent 59% 70%, rgba(255,255,255,.04) 70% 86%, transparent 86%),
                           linear-gradient(160deg, #1b46ff 0%, #0b1f9c 38%, #050b3a 100%); }
  .it { font-style: italic; } .num { font-variant-numeric: tabular-nums; }
  h2 { margin: 0; font-size: 1.5rem; line-height: 1.5rem; font-style: italic; font-weight: 900; letter-spacing: -.02rem; text-transform: uppercase; transform: skewX(-8deg); transform-origin: left; }
  h2 span { color: var(--cy); }
  .tag { display: inline-block; background: #000; color: #fff; padding: 0 .45rem; transform: skewX(-14deg); font-size: .62rem; letter-spacing: .08rem; text-transform: uppercase; }
  .tag.cy { background: var(--cy); color: #04103c; } .tag.wh { background: #fff; color: #04103c; } .tag.red { background: #ff2e4d; }

  #pages { flex: 1; min-height: 0; position: relative; }
  .page { position: absolute; inset: 0; padding: .7rem .8rem .3rem; display: none; overflow-y: auto; }
  .page.on { display: block; }
  #tabs { display: flex; gap: .3rem; padding: .35rem .6rem .5rem; }
  .tab { flex: 1; text-align: center; padding: .42rem 0 .46rem; font-size: 1rem; font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: .02rem; color: #9fb4ff;
         background: rgba(3,8,46,.75); transform: skewX(-14deg); border-bottom: .16rem solid rgba(83,230,255,.25); }
  .tab b { display: block; transform: skewX(14deg); font-weight: inherit; }
  .tab.on { color: #04103c; background: #fff; border-bottom-color: var(--cy); box-shadow: .25rem .25rem 0 #000; }

  /* calendar */
  #cal { display: flex; gap: .9rem; height: 100%; }
  #month { flex: none; width: 19.5rem; display: flex; flex-direction: column; }
  #mhead { display: flex; align-items: flex-end; gap: .6rem; margin-bottom: .35rem; }
  #mnum { font-size: 3.4rem; line-height: 2.9rem; font-style: italic; font-weight: 900; letter-spacing: -.12rem; }
  #mname { font-size: 1.15rem; font-style: italic; font-weight: 900; text-transform: uppercase; color: var(--cy); line-height: 1.2rem; }
  #mname small { display: block; font-size: .62rem; color: #9fb4ff; letter-spacing: .1rem; }
  .nav { margin-left: auto; display: flex; gap: .3rem; }
  .nav div { width: 2.1rem; height: 1.7rem; background: rgba(3,8,46,.8); display: flex; align-items: center; justify-content: center; font-size: 1.05rem; transform: skewX(-14deg); }
  .nav div:active { background: var(--cy); color: #04103c; }
  #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: .16rem; flex: 1; grid-template-rows: 1.1rem; grid-auto-rows: 1fr; }
  #grid .wd { font-size: .58rem; letter-spacing: .08rem; text-align: center; color: #9fb4ff; align-self: end; height: 1rem; }
  #grid .wd.sun, .d.sun .n { color: #ff6d86; } #grid .wd.sat, .d.sat .n { color: #7fdcff; }
  .d { background: rgba(3,8,46,.62); position: relative; padding: .12rem .28rem; min-height: 2.5rem; }
  .d .n { font-size: .98rem; font-style: italic; font-weight: 900; }
  .d.past { opacity: .42; }
  .d.exam { background: rgba(255,46,77,.42); } .d.exam::after { content: "EXAM"; position: absolute; left: .28rem; bottom: .12rem; font-size: .46rem; letter-spacing: .06rem; }
  .d.today { background: #fff; color: #04103c; box-shadow: .2rem .2rem 0 #000; opacity: 1; z-index: 1; } .d.today .n { color: #04103c; }
  .d .moon { position: absolute; right: .22rem; top: .22rem; width: .95rem; height: .95rem; border-radius: 50%; background: #ffe45c; box-shadow: 0 0 .5rem #ffe45c; }
  #side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .55rem; }
  #today { background: #fff; color: #04103c; padding: .5rem .7rem .55rem; clip-path: polygon(0 0, 100% 0, 100% calc(100% - .7rem), calc(100% - .7rem) 100%, 0 100%); }
  #tdate { font-size: 2.5rem; line-height: 2.3rem; font-style: italic; font-weight: 900; letter-spacing: -.08rem; }
  #tdate small { font-size: 1rem; letter-spacing: 0; margin-left: .3rem; color: var(--bl); }
  #ttime { font-size: .95rem; font-style: italic; font-weight: 900; text-transform: uppercase; color: var(--bl); }
  .up { background: rgba(3,8,46,.72); border-left: .2rem solid var(--cy); padding: .4rem .6rem; display: flex; align-items: center; gap: .6rem; }
  .up .big { font-size: 2rem; line-height: 2rem; font-style: italic; font-weight: 900; color: #ffe45c; min-width: 2.3rem; text-align: right; }
  .up .big.red { color: #ff6d86; } .up .t { font-size: .86rem; line-height: 1.05rem; flex: 1; min-width: 0; } .up .t small { display: block; font-size: .66rem; color: #9fb4ff; font-weight: 600; }
  #phase { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: #0a1247; position: relative; overflow: hidden; flex: none; box-shadow: 0 0 0 .12rem #ffe45c; }
  #phase i { position: absolute; inset: 0; border-radius: 50%; background: #ffe45c; }
  #phase b { position: absolute; top: 0; bottom: 0; left: 50%; width: 100%; margin-left: -50%; border-radius: 50%; }

  /* social */
  #stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: .45rem 0 .7rem; }
  .stat { background: rgba(3,8,46,.72); padding: .4rem .6rem .5rem; position: relative; clip-path: polygon(0 0, 100% 0, 100% calc(100% - .6rem), calc(100% - .6rem) 100%, 0 100%); }
  .stat .k { font-size: .95rem; font-style: italic; font-weight: 900; text-transform: uppercase; color: var(--cy); }
  .stat .r { position: absolute; right: .6rem; top: .1rem; font-size: 2.3rem; line-height: 2.4rem; font-style: italic; font-weight: 900; }
  .stat .w { font-size: .78rem; margin: .05rem 0 .3rem; }
  .pips { display: flex; gap: .14rem; transform: skewX(-18deg); }
  .pips i { flex: 1; height: .42rem; background: rgba(255,255,255,.16); } .pips i.on { background: #fff; } .pips.max i.on { background: #ffe45c; }
  #links { display: grid; grid-template-columns: 1fr 1fr; gap: .32rem .5rem; }
  .link { display: flex; align-items: center; gap: .5rem; background: rgba(3,8,46,.72); padding: .28rem .55rem .3rem .3rem; min-height: 2.5rem; }
  .link .a { width: 2.1rem; height: 2rem; background: #fff; color: #04103c; font: italic 900 .95rem Georgia, "Noto Serif", serif; display: flex; align-items: center; justify-content: center; transform: skewX(-10deg); flex: none; }
  .link .t { flex: 1; min-width: 0; } .link .n { font-size: .86rem; line-height: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link .ar { font-size: .58rem; letter-spacing: .1rem; text-transform: uppercase; color: var(--cy); }
  .link .rk { font-size: 1.5rem; font-style: italic; font-weight: 900; width: 2.6rem; text-align: right; flex: none; } .link .rk small { font-size: .6rem; color: #9fb4ff; margin-right: .1rem; }
  .link.max .rk { color: #ffe45c; font-size: 1.05rem; } .link.max .a { background: #ffe45c; }

  /* party and personas */
  .cards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .5rem; margin-top: .45rem; }
  .cards.one { grid-template-columns: 1fr; }
  .card { background: rgba(3,8,46,.74); padding: .4rem .6rem .5rem; border-left: .2rem solid var(--cy); position: relative; }
  .card.lead { border-left-color: #fff; } .card.eq { border-left-color: #ffe45c; }
  .card .top { display: flex; align-items: baseline; gap: .45rem; }
  .card .nm { font-size: 1.15rem; font-style: italic; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .card .lv { font-size: .62rem; color: #9fb4ff; } .card .lv b { font-size: 1.15rem; color: #fff; font-style: italic; font-weight: 900; margin-left: .15rem; }
  .vit { display: flex; gap: .9rem; margin: .1rem 0 .25rem; font-style: italic; }
  .vit span { font-size: .62rem; } .vit b { font-size: 1.2rem; font-weight: 900; margin-left: .2rem; } .vit .hp { color: #6dffd0; } .vit .sp { color: #ffe45c; }
  .per { font-size: .8rem; margin-bottom: .25rem; } .per small { font-size: .58rem; color: var(--cy); letter-spacing: .1rem; text-transform: uppercase; margin-right: .35rem; }
  .st { display: grid; grid-template-columns: repeat(5, 1fr); gap: .25rem; margin: .2rem 0 .3rem; }
  .st div { font-size: .56rem; color: #9fb4ff; letter-spacing: .06rem; } .st b { display: block; font-size: .95rem; color: #fff; font-style: italic; font-weight: 900; }
  .st u { display: block; height: .2rem; background: rgba(255,255,255,.16); text-decoration: none; position: relative; } .st u i { position: absolute; inset: 0 auto 0 0; background: var(--cy); }
  .sk { display: flex; flex-wrap: wrap; gap: .2rem .25rem; }
  .sk span { background: rgba(83,230,255,.16); padding: .02rem .4rem .06rem; font-size: .68rem; font-weight: 600; }
  #yen { position: absolute; right: .8rem; top: .75rem; font-size: 1.15rem; font-style: italic; font-weight: 900; background: #fff; color: #04103c; padding: 0 .6rem; transform: skewX(-14deg); }
  #yen small { font-size: .6rem; color: var(--bl); margin-right: .3rem; }

  #idle { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem;
          background: linear-gradient(160deg, #1b46ff 0%, #0b1f9c 38%, #050b3a 100%); }
  #idle .l { font-size: 3.2rem; line-height: 3rem; font-style: italic; font-weight: 900; letter-spacing: -.12rem; transform: skewX(-8deg); text-align: center; }
  #idle .l span { color: var(--cy); display: block; }
  #idle .s { font-size: .95rem; font-style: italic; background: #000; padding: .1rem .9rem; transform: skewX(-14deg); }
</style>
</head>
<body>
<div id="pages">
  <div class="page on" id="p-calendar">
    <div id="cal">
      <div id="month">
        <div id="mhead"><div id="mnum" class="num"></div><div id="mname"></div><div class="nav"><div data-d="-1">&#9664;</div><div data-d="1">&#9654;</div></div></div>
        <div id="grid"></div>
      </div>
      <div id="side">
        <div id="today"><div id="tdate" class="num"></div><div id="ttime"></div></div>
        <div id="upcoming"></div>
      </div>
    </div>
  </div>
  <div class="page" id="p-social"><h2>Social <span>Stats</span></h2><div id="stats"></div><h2>Social <span>Links</span></h2><div id="links" style="margin-top:.45rem"></div></div>
  <div class="page" id="p-party"><h2>Battle <span>Party</span></h2><div id="yen"></div><div id="party" class="cards"></div></div>
  <div class="page" id="p-personas"><h2><span id="pcount"></span> Personas</h2><div id="personas" class="cards"></div></div>
</div>
<div id="tabs">
  <div class="tab on" data-p="calendar"><b>Calendar</b></div><div class="tab" data-p="social"><b>Social</b></div><div class="tab" data-p="party"><b>Party</b></div><div class="tab" data-p="personas"><b>Personas</b></div>
</div>
<div id="idle"><div class="l">Persona 3 <span>Reload</span></div><div class="s" id="idletext">Loading</div></div>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // The school year runs from 1 April 2009; the game counts days from there.
  const dateOf = day => new Date(Date.UTC(2009, 3, 1 + day));
  const dayOf = (y, m, d) => Math.round((Date.UTC(y, m, d) - Date.UTC(2009, 3, 1)) / 864e5);
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const TIMES = ["", "Early Morning", "Morning", "Morning", "Lunchtime", "Afternoon", "After School", "Evening", "Dark Hour", "Late Night"];
  const EXAMS = [[2009, 4, 18, 23], [2009, 6, 14, 18], [2009, 9, 13, 17], [2009, 11, 14, 19]].map(([y, m, a, b]) => [dayOf(y, m, a), dayOf(y, m, b)]);
  const STATS = [["Academics", ["Slacker", "Average", "Above Average", "Smart", "Intelligent", "Genius"]],
                 ["Charm", ["Plain", "Unpolished", "Confident", "Smooth", "Popular", "Charismatic"]],
                 ["Courage", ["Timid", "Ordinary", "Determined", "Tough", "Fearless", "Badass"]]];
  const ARCANA = [, ["0", "Fool", "S.E.E.S."], ["I", "Magician", "Kenji Tomochika"], ["II", "Priestess", "Fuuka Yamagishi"], ["III", "Empress", "Mitsuru Kirijo"],
    ["IV", "Emperor", "Hidetoshi Odagiri"], ["V", "Hierophant", "Bunkichi and Mitsuko"], ["VI", "Lovers", "Yukari Takeba"], ["VII", "Chariot", "Kazushi Miyamoto"],
    ["VIII", "Justice", "Chihiro Fushimi"], ["IX", "Hermit", "Maya"], ["X", "Fortune", "Keisuke Hiraga"], ["XI", "Strength", "Yuko Nishiwaki"],
    ["XII", "Hanged Man", "Maiko Oohashi"], ["XIII", "Death", "Pharos"], ["XIV", "Temperance", "Bebe"], ["XV", "Devil", "President Tanaka"],
    ["XVI", "Tower", "Mutatsu"], ["XVII", "Star", "Mamoru Hayase"], ["XVIII", "Moon", "Nozomi Suemitsu"], ["XIX", "Sun", "Akinari Kamiki"],
    ["XX", "Judgement", "Nyx Annihilation Team"], ["XXI", "Aeon", "Aigis"]];
  const MEMBERS = [, , "Yukari", "Junpei", "Akihiko", "Mitsuru", "Fuuka", "Aigis", "Ken", "Koromaru", "Shinjiro"];
  const ST = ["St", "Ma", "En", "Ag", "Lu"];

  let state = null, shownMonth = null, follow = true;
  const put = (id, html) => { const el = $(id); if (el.dataset.h !== html) { el.dataset.h = html; el.innerHTML = html; } };
  // Days until the moon is full; the game's moon age is 13 on those nights.
  const toFull = s => s.moon == null ? null : (43 - s.moon) % 30;
  const pips = (n, of, max) => `<div class="pips${max ? " max" : ""}">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>`;

  function calendar(s) {
    const now = dateOf(s.day);
    if (follow || !shownMonth) shownMonth = [now.getUTCFullYear(), now.getUTCMonth()];
    const [y, m] = shownMonth, first = new Date(Date.UTC(y, m, 1)), count = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    const full = toFull(s) == null ? -1 : s.day + toFull(s);
    $("mnum").textContent = m + 1; put("mname", `${MONTHS[m]}<small>${y}</small>`);
    let h = WD.map((w, i) => `<div class="wd ${i == 0 ? "sun" : i == 6 ? "sat" : ""}">${w.toUpperCase()}</div>`).join("") + "<div></div>".repeat(first.getUTCDay());
    for (let d = 1; d <= count; d++) {
      const day = dayOf(y, m, d), wd = (first.getUTCDay() + d - 1) % 7;
      const cls = ["d", wd == 0 ? "sun" : wd == 6 ? "sat" : "", day < s.day ? "past" : "", day == s.day ? "today" : "", EXAMS.some(([a, b]) => day >= a && day <= b) ? "exam" : ""].join(" ");
      h += `<div class="${cls}"><div class="n num">${d}</div>${day == full ? '<div class="moon"></div>' : ""}</div>`;
    }
    put("grid", h);
    put("tdate", `${now.getUTCMonth() + 1}/${now.getUTCDate()}<small>${WD[now.getUTCDay()].toUpperCase()}</small>`);
    $("ttime").textContent = TIMES[s.time] || "";
    let up = "";
    if (toFull(s) != null) {
      const f = dateOf(full), age = s.moon, lit = age <= 13 ? age / 13 : Math.max(0, (27 - age) / 14), waxing = age <= 13;
      // a lit disc with a shadow ellipse over one side, flipped for the waning half
      const w = Math.abs(1 - 2 * lit) * 100, dark = lit < .5;
      const phase = `<div id="phase" style="transform:scaleX(${waxing ? 1 : -1})"><i style="clip-path:inset(0 0 0 50%)"></i><b style="width:${w}%;margin-left:${-w / 2}%;background:${dark ? "#0a1247" : "#ffe45c"}"></b></div>`;
      up += `<div class="up">${phase}<div class="big num">${toFull(s)}</div><div class="t">${toFull(s) == 0 ? "Full moon tonight" : toFull(s) == 1 ? "day to the full moon" : "days to the full moon"}<small>${WD[f.getUTCDay()]} ${f.getUTCMonth() + 1}/${f.getUTCDate()}</small></div></div>`;
    }
    const ex = EXAMS.find(([a, b]) => b >= s.day);
    if (ex) {
      const a = dateOf(ex[0]), b = dateOf(ex[1]), n = ex[0] - s.day;
      up += `<div class="up" style="border-color:#ff2e4d"><div class="big red num">${n > 0 ? n : "!"}</div><div class="t">${n > 0 ? (n == 1 ? "day to exams" : "days to exams") : "Exam week"}<small>${a.getUTCMonth() + 1}/${a.getUTCDate()} to ${b.getUTCMonth() + 1}/${b.getUTCDate()}</small></div></div>`;
    }
    put("upcoming", `<div style="display:flex;flex-direction:column;gap:.45rem">${up}</div>`);
  }

  function social(s) {
    put("stats", STATS.map(([name, words], i) => { const r = s.stats[i] || 1;
      return `<div class="stat"><div class="k">${name}</div><div class="r num">${r}</div><div class="w">${words[r - 1]}</div>${pips(r, 6, r == 6)}</div>`; }).join(""));
    put("links", s.links.length ? s.links.map(l => { const a = ARCANA[l.arcana] || ["?", "Arcana " + l.arcana, ""], max = l.rank >= 10;
      return `<div class="link${max ? " max" : ""}"><div class="a">${a[0]}</div><div class="t"><div class="ar">${a[1]}</div><div class="n">${esc(a[2])}</div>${pips(l.rank, 10, max)}</div><div class="rk num">${max ? "MAX" : "<small>RANK</small>" + l.rank}</div></div>`; }).join("")
      : '<div class="tag">No social links yet</div>');
  }

  const statRow = st => `<div class="st">${st.map((v, i) => `<div>${ST[i].toUpperCase()}<b class="num">${v}</b><u><i style="width:${Math.min(100, v)}%"></i></u></div>`).join("")}</div>`;
  const skills = sk => `<div class="sk">${sk.map(k => `<span>${esc(k)}</span>`).join("")}</div>`;
  function party(s) {
    put("yen", `<small>YEN</small>${s.money.toLocaleString("en-US")}`);
    const eq = s.personas.find(p => p.equipped);
    put("party", s.party.filter(m => m.slot > 0).sort((a, b) => a.slot - b.slot).map(m => {
      const lead = m.id == 1, st = lead ? eq && eq.stats : m.stats, sk = lead ? eq && eq.skills : m.skills;
      return `<div class="card${lead ? " lead" : ""}"><div class="top"><div class="nm">${esc(lead ? s.name : MEMBERS[m.id] || "")}</div>${lead ? '<span class="tag wh">Leader</span>' : ""}<div class="lv">LV<b class="num">${m.level}</b></div></div>
        <div class="vit"><span class="hp">HP<b class="num">${m.hp}</b></span><span class="sp">SP<b class="num">${m.sp}</b></span></div>
        <div class="per"><small>Persona</small>${esc(m.persona || "")}</div>${st ? statRow(st) : ""}${sk ? skills(sk) : ""}</div>`; }).join(""));
  }
  function personas(s) {
    $("pcount").textContent = s.personas.length;
    put("personas", s.personas.map(p => `<div class="card${p.equipped ? " eq" : ""}"><div class="top"><div class="nm">${esc(p.name)}</div>${p.equipped ? '<span class="tag cy">Equipped</span>' : ""}<div class="lv">LV<b class="num">${p.level}</b></div></div>${statRow(p.stats)}${skills(p.skills)}</div>`).join(""));
  }

  function render(s) {
    state = s;
    const live = s && s.ready;
    $("idle").style.display = live ? "none" : "flex";
    if (!live) { $("idletext").textContent = s ? "Load a save to begin" : "Loading"; return; }
    calendar(s); social(s); party(s); personas(s);
  }
  document.querySelector(".nav").addEventListener("click", e => {
    const d = Number(e.target.dataset.d); if (!d || !shownMonth || !state) return;
    const next = new Date(Date.UTC(shownMonth[0], shownMonth[1] + d, 1)), now = dateOf(state.day);
    if (dayOf(next.getUTCFullYear(), next.getUTCMonth(), 1) < dayOf(2009, 3, 1) || next.getUTCFullYear() > 2010 || (next.getUTCFullYear() == 2010 && next.getUTCMonth() > 2)) return;
    shownMonth = [next.getUTCFullYear(), next.getUTCMonth()];
    follow = shownMonth[0] == now.getUTCFullYear() && shownMonth[1] == now.getUTCMonth();
    calendar(state);
  });
  const show = p => { document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.p == p)); document.querySelectorAll(".page").forEach(x => x.classList.toggle("on", x.id == "p-" + p)); try { sessionStorage.tab = p; } catch (e) {} };
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => show(t.dataset.p)));
  try { if (sessionStorage.tab) show(sessionStorage.tab); } catch (e) {}
  armada.onState = render;
  render(armada.last);
</script>
</body>
</html>
