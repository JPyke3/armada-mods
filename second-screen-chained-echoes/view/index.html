<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Sized from the panel: 1rem is about 37 px on a 1240x1080 screen. */
  html { font-size: 3.4vh; }
  html, body { margin: 0; height: 100%; background: #12142a; color: #f4ead2; font-family: "Noto Sans", sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; background:
    linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%) 0 0 / 2.4rem 2.4rem,
    linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%) 1.2rem 1.2rem / 2.4rem 2.4rem, #14162c; }
  img { image-rendering: pixelated; display: block; }
  main { flex: 1; position: relative; overflow: hidden; }
  section { position: absolute; inset: 0; display: none; overflow-y: auto; padding: .7rem .9rem; box-sizing: border-box; }
  section.on { display: block; }
  nav { display: flex; gap: .3rem; padding: .35rem .5rem .45rem; background: #0c0d1c; border-top: .1rem solid #e8a33d; }
  nav div { flex: 1; text-align: center; padding: .5rem 0 .55rem; font-weight: 800; letter-spacing: .1rem; text-transform: uppercase; font-size: .95rem;
    color: #b9a57c; background: #1b1e3a; border: .08rem solid #3a3550; border-radius: .25rem; }
  nav div.on { color: #ffd77a; background: linear-gradient(#5a1a1c, #3a1012); border-color: #e8a33d; }
  nav small { font-size: .7rem; margin-left: .3rem; color: #e8a33d; }
  .panel { background: #1a1d3a; border: .09rem solid #e8a33d; border-radius: .3rem; box-shadow: inset 0 0 0 .12rem #0c0d1c; }
  h2 { margin: .1rem 0 .45rem; padding: .22rem .7rem .28rem; font-size: .82rem; letter-spacing: .14rem; text-transform: uppercase; color: #ffd77a;
    background: linear-gradient(90deg, #5a1a1c, #3a1012 70%, transparent); border-left: .22rem solid #e8a33d; }
  .empty { color: #8f86a8; text-align: center; margin-top: 4rem; }

  /* map */
  #map { padding: 0; overflow: hidden; background: #0c0d1c; touch-action: none; }
  #sheet { position: absolute; left: 0; top: 0; }
  #pin { position: absolute; width: 1.5rem; height: 1.5rem; margin: -1.5rem 0 0 -.75rem; pointer-events: none; filter: drop-shadow(0 .12rem .1rem rgba(0,0,0,.6)); }
  #pin::before { content: ""; position: absolute; inset: 0 .2rem .35rem .2rem; background: #f39a1f; border: .14rem solid #1b1024; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
  #pin::after { content: ""; position: absolute; left: 50%; bottom: 0; width: .5rem; height: .5rem; margin-left: -.25rem; background: #f39a1f; border-right: .14rem solid #1b1024; border-bottom: .14rem solid #1b1024; transform: rotate(45deg); }
  #pin i { position: absolute; left: 50%; top: .32rem; width: .42rem; height: .42rem; margin-left: -.21rem; background: #1b1024; border-radius: 50%; z-index: 1; }
  #place { position: absolute; left: .6rem; top: .55rem; padding: .25rem .8rem .32rem; font-weight: 800; font-size: 1rem; color: #ffd77a; }
  #follow { position: absolute; right: .6rem; top: .55rem; padding: .3rem .8rem .36rem; font-weight: 800; font-size: .85rem; letter-spacing: .08rem; text-transform: uppercase; color: #ffd77a; display: none; }
  #nomap { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #8f86a8; }

  /* party */
  .member { display: grid; grid-template-columns: 4.4rem 1fr; gap: .1rem .8rem; padding: .55rem .7rem; margin-bottom: .5rem; }
  .member.back { opacity: .72; }
  .face { grid-row: 1 / 3; width: 4.4rem; height: 4.4rem; display: flex; align-items: center; justify-content: center; }
  .face img { width: 100%; height: 100%; object-fit: contain; }
  .face b { font-size: 2.2rem; color: #e8a33d; }
  .member .top { display: flex; align-items: baseline; gap: .6rem; }
  .member .name { font-size: 1.2rem; font-weight: 800; flex: 1; }
  .member .cls { color: #b9a57c; font-size: .8rem; }
  .member .sp { color: #ffd77a; font-weight: 800; font-size: .85rem; } .member .sp small { color: #b9a57c; font-weight: 600; margin-right: .2rem; }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; align-self: end; }
  .bar { position: relative; height: 1.3rem; background: #0c0d1c; border: .07rem solid #3a3550; border-radius: .2rem; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; transition: width .25s; }
  .bar.hp i { background: linear-gradient(#8fe07a, #2f9a43); } .bar.hp.low i { background: linear-gradient(#ff9a6a, #c93a2f); }
  .bar.tp i { background: linear-gradient(#7ac8ff, #2f6fd0); }
  .bar span { position: absolute; inset: 0; padding: 0 .4rem; display: flex; justify-content: space-between; font-size: .8rem; line-height: 1.25rem; font-weight: 800; text-shadow: 0 .06rem .1rem #000; }
  .detail { grid-column: 1 / 3; display: none; margin-top: .45rem; padding-top: .45rem; border-top: .07rem solid #3a3550; }
  .member.open .detail { display: block; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: .3rem; text-align: center; }
  .stats div { background: #0c0d1c; border-radius: .2rem; padding: .15rem 0 .2rem; }
  .stats small { display: block; color: #b9a57c; font-size: .62rem; letter-spacing: .08rem; } .stats b { font-size: 1rem; }
  .gear { display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem; margin-top: .35rem; font-size: .82rem; }
  .gear div { background: #0c0d1c; border-radius: .2rem; padding: .2rem .5rem .25rem; }
  .gear small { display: block; color: #b9a57c; font-size: .62rem; letter-spacing: .08rem; text-transform: uppercase; } .gear em { color: #ffd77a; font-style: normal; font-weight: 800; }
  #purse { display: flex; justify-content: flex-end; gap: 1.2rem; margin: 0 .2rem .5rem; font-weight: 800; color: #ffd77a; }
  #purse small { color: #b9a57c; font-weight: 600; margin-left: .25rem; font-size: .75rem; }

  /* journal */
  .quest { padding: .55rem .8rem .6rem; margin-bottom: .5rem; }
  .quest .name { font-weight: 800; font-size: 1.1rem; } .quest .name small { font-size: .65rem; letter-spacing: .1rem; color: #14162c; background: #e8a33d; border-radius: .15rem; padding: .05rem .35rem .1rem; margin-left: .5rem; vertical-align: .15rem; }
  .quest .desc { color: #b9a57c; font-size: .8rem; margin: .15rem 0 .35rem; }
  .task { font-size: .9rem; padding-left: 1.4rem; position: relative; margin: .2rem 0; }
  .task::before { content: ""; position: absolute; left: .1rem; top: .3rem; width: .62rem; height: .62rem; border: .1rem solid #e8a33d; border-radius: .12rem; }
  .task.done { color: #8f86a8; text-decoration: line-through; } .task.done::before { background: #8fe07a; border-color: #8fe07a; }

  /* items */
  .items { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; margin-bottom: .6rem; }
  .item { padding: .35rem .65rem .4rem; display: flex; align-items: center; gap: .5rem; }
  .item .n { flex: 1; font-weight: 700; font-size: .92rem; } .item .c { color: #ffd77a; font-weight: 800; font-size: 1.1rem; }
  .item.sel { background: #3a1012; }
  #about { position: absolute; left: .5rem; right: .5rem; bottom: .4rem; padding: .5rem .8rem .6rem; display: none; font-size: .9rem; }
  #about b { display: block; color: #ffd77a; font-size: 1rem; }

  #wait { position: fixed; inset: 0; display: flex; flex-direction: column; gap: .6rem; align-items: center; justify-content: center; background: #12142a; color: #b9a57c; font-size: .95rem; }
  #wait b { font-size: 2rem; font-weight: 800; letter-spacing: .35rem; color: #ffd77a; text-shadow: 0 .12rem 0 #5a1a1c; }
</style>
</head>
<body>
<main>
  <section id="map" class="on"><div id="sheet"><img id="mapimg"><div id="pin"><i></i></div></div>
    <div id="place" class="panel"></div><div id="follow" class="panel">Follow</div><div id="nomap">No map for this place</div></section>
  <section id="party"></section>
  <section id="journal"></section>
  <section id="items"><div id="itemlist"></div><div id="about" class="panel"></div></section>
</main>
<nav><div data-t="map" class="on">Map</div><div data-t="party">Party</div><div data-t="journal">Journal<small id="nq"></small></div><div data-t="items">Items<small id="ni"></small></div></nav>
<div id="wait"><b>CHAINED ECHOES</b><span id="waitline">Loading</span></div>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // the front row starts with its details shown; a tap flips a card
  const open = new Set(), shown = {};
  function put(id, html) { if (shown[id] !== html) { shown[id] = html; $(id).innerHTML = html; } }

  // ---- map: drag to pan, pinch to zoom; it follows the player until you move it ----
  const view = { z: 3, x: 0, y: 0, follow: true, w: 640, h: 640, px: .5, py: .5, file: "" };
  function fit() { const m = $("map"); return Math.min(m.clientWidth / view.w, m.clientHeight / view.h); }
  function place() {
    const m = $("map"), s = fit() * view.z, W = m.clientWidth, H = m.clientHeight;
    if (view.follow) { view.x = W / 2 - view.px * view.w * s; view.y = H / 2 - view.py * view.h * s; }
    const lim = (v, size, box) => size <= box ? (box - size) / 2 : Math.min(0, Math.max(box - size, v));
    view.x = lim(view.x, view.w * s, W); view.y = lim(view.y, view.h * s, H);
    // the picture is sized, not scaled, so its pixels stay sharp
    $("sheet").style.transform = `translate(${Math.round(view.x)}px,${Math.round(view.y)}px)`;
    $("mapimg").style.width = view.w * s + "px"; $("mapimg").style.height = view.h * s + "px";
    $("pin").style.left = view.px * view.w * s + "px"; $("pin").style.top = view.py * view.h * s + "px";
    $("follow").style.display = view.follow ? "none" : "block";
  }
  const touches = new Map(); let pinch = 0;
  $("map").addEventListener("pointerdown", e => { if (e.target.id === "follow") return; touches.set(e.pointerId, [e.clientX, e.clientY]); $("map").setPointerCapture(e.pointerId); pinch = 0; });
  $("map").addEventListener("pointermove", e => {
    const old = touches.get(e.pointerId); if (!old) return;
    touches.set(e.pointerId, [e.clientX, e.clientY]);
    const pts = [...touches.values()];
    if (pts.length === 1) { view.follow = false; view.x += e.clientX - old[0]; view.y += e.clientY - old[1]; }
    else if (pts.length === 2) {
      const d = Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]), cx = (pts[0][0] + pts[1][0]) / 2, cy = (pts[0][1] + pts[1][1]) / 2;
      if (pinch) { const z = Math.min(8, Math.max(1, view.z * d / pinch)), k = z / view.z; view.follow = false; view.x = cx - (cx - view.x) * k; view.y = cy - (cy - view.y) * k; view.z = z; }
      pinch = d;
    }
    place();
  });
  const lift = e => { touches.delete(e.pointerId); pinch = 0; };
  $("map").addEventListener("pointerup", lift); $("map").addEventListener("pointercancel", lift);
  $("follow").addEventListener("click", () => { view.follow = true; place(); });
  window.addEventListener("resize", place);

  function bar(cls, v, max) {
    const p = max > 0 ? Math.max(0, Math.min(100, 100 * v / max)) : 0;
    return `<div class="bar ${cls}${cls === "hp" && p < 30 ? " low" : ""}"><i style="width:${p}%"></i><span><b>${cls.toUpperCase()}</b><b>${v} / ${max}</b></span></div>`;
  }
  const gear = (label, g) => `<div><small>${label}</small>${g ? esc(g.name) + (g.level ? ` <em>+${g.level}</em>` : "") : "-"}</div>`;
  const KINDS = ["Consumables", "Loot", "Materials", "Key items"];
  let picked = null;

  function render(s) {
    $("wait").style.display = s.ready ? "none" : "flex";
    $("waitline").textContent = "Start or load a game";
    if (!s.ready) return;

    const m = s.map;
    $("nomap").style.display = m ? "none" : "flex"; $("sheet").style.display = m ? "block" : "none";
    if (m) {
      if (m.file !== view.file) { view.file = m.file; $("mapimg").src = armada.data + m.file; }
      view.w = m.w; view.h = m.h;
      $("pin").style.display = m.x == null ? "none" : "block";
      if (m.x != null) { view.px = m.x; view.py = m.y; }
      place();
    }
    $("place").textContent = s.place || ""; $("place").style.display = s.place ? "block" : "none";

    const h = Math.floor(s.playTime / 3600), mi = Math.floor(s.playTime / 60) % 60;
    const people = s.party.filter(p => !!p.mech === !!s.inMech), list = (people.length ? people : s.party).slice().sort((a, b) => a.pos - b.pos);
    put("party", `<div id="purse"><span>${s.money.toLocaleString()}<small>arc</small></span><span>${h}:${String(mi).padStart(2, "0")}<small>played</small></span></div>` +
      list.map(p => `
      <div class="member panel${p.pos > 3 ? " back" : ""}${(p.pos <= 3) !== open.has(p.id) ? " open" : ""}" data-id="${p.id}">
        <div class="face">${p.art ? `<img src="${armada.data}art/portrait-${p.id}.png">` : `<b>${esc(p.name[0])}</b>`}</div>
        <div class="top"><span class="name">${esc(p.name)}</span><span class="cls">${esc(p.emblem || "")}</span>${p.mech ? "" : `<span class="sp"><small>SP</small>${p.sp}</span>`}</div>
        <div class="bars">${bar("hp", p.hp, p.maxHp)}${bar("tp", p.tp, p.maxTp)}</div>
        <div class="detail">
          <div class="stats"><div><small>ATK</small><b>${p.atk}</b></div><div><small>MAG</small><b>${p.mag}</b></div><div><small>DEF</small><b>${p.def}</b></div><div><small>MND</small><b>${p.mnd}</b></div><div><small>AGI</small><b>${p.agi}</b></div><div><small>CRIT</small><b>${p.crit}</b></div></div>
          <div class="gear">${gear("Weapon", p.weapon)}${gear("Armor", p.armor)}${gear("Accessory", p.accessory)}</div>
        </div>
      </div>`).join(""));

    const quests = s.quests.slice().sort((a, b) => b.main - a.main || a.order - b.order);
    $("nq").textContent = quests.length || "";
    put("journal", quests.map(q => `
      <div class="quest panel"><div class="name">${esc(q.name)}${q.main ? "<small>MAIN</small>" : ""}</div><div class="desc">${esc(q.desc)}</div>
      ${q.tasks.sort((a, b) => a.done - b.done || a.order - b.order).map(t => `<div class="task${t.done ? " done" : ""}">${esc(t.text)}</div>`).join("")}</div>`).join("") || '<div class="empty">No open quests</div>');

    $("ni").textContent = s.items.length || "";
    const kinds = {}; s.items.forEach(i => (kinds[i.type] = kinds[i.type] || []).push(i));
    put("itemlist", Object.keys(kinds).sort().map(k => `<h2>${KINDS[k] || "Other"}</h2><div class="items">` + kinds[k].map(i =>
      `<div class="item panel${picked === i.id ? " sel" : ""}" data-id="${i.id}" data-d="${esc(i.desc)}" data-n="${esc(i.name)}"><span class="n">${esc(i.name)}</span><span class="c">${i.count}</span></div>`).join("") + "</div>").join("") || '<div class="empty">No items</div>');
  }

  $("party").addEventListener("click", e => {
    const el = e.target.closest(".member"); if (!el) return;
    const id = Number(el.dataset.id);
    open.has(id) ? open.delete(id) : open.add(id);
    el.classList.toggle("open"); shown.party = null;
  });
  // tapping an item shows what it is; nothing is used from here
  $("items").addEventListener("click", e => {
    const el = e.target.closest(".item"), about = $("about");
    document.querySelectorAll(".item.sel").forEach(x => x.classList.remove("sel"));
    if (!el || picked === Number(el.dataset.id)) { picked = null; about.style.display = "none"; shown.itemlist = null; return; }
    picked = Number(el.dataset.id); el.classList.add("sel"); shown.itemlist = null;
    about.innerHTML = `<b>${esc(el.dataset.n)}</b>${esc(el.dataset.d)}`; about.style.display = "block";
  });
  document.querySelector("nav").addEventListener("click", e => {
    const tab = e.target.closest("div[data-t]"); if (!tab) return;
    document.querySelectorAll("nav div").forEach(d => d.classList.toggle("on", d === tab));
    document.querySelectorAll("section").forEach(x => x.classList.toggle("on", x.id === tab.dataset.t));
    try { sessionStorage.tab = tab.dataset.t; } catch (e) {}
    place();
  });
  try { const t = sessionStorage.tab; if (t) document.querySelector(`nav div[data-t="${t}"]`).click(); } catch (e) {}
  armada.onState = render;
  if (armada.last) render(armada.last);
</script>
</body>
</html>
